# =============================================================================
# Stratum AI - Edge nginx for api.stratumai.app (Hetzner origin, Cloudflare edge)
# =============================================================================
# Serves ONLY the API. The frontend is on Cloudflare Pages, so there is no
# frontend upstream here and no SPA fallback.
#
# Mounted to /etc/nginx/conf.d/default.conf, so everything below is inside the
# stock nginx.conf's `http {}` block.
# =============================================================================

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# Cloudflare real client IP  (see issue #652)
# -----------------------------------------------------------------------------
# Cloudflare terminates at the edge and forwards the visitor address in
# CF-Connecting-IP. Its edge IPs are PUBLIC, which matters: the application's
# own IP helpers only trust X-Forwarded-For when the direct peer is a private
# range, so without this block they would refuse the header and record the
# Cloudflare address instead of the visitor's.
#
# Rewriting $remote_addr here fixes every consumer at once — including the five
# call sites that read request.client.host directly and never had the
# trusted-proxy logic (auth.py login/logout/tenant-switch, tenancy/deps.py,
# cms.py). No application change is required.
#
# set_real_ip_from entries are the ONLY addresses permitted to set the header.
# A client that sends CF-Connecting-IP directly to the origin is ignored,
# because its address is not in this list. Keep the origin firewalled to
# Cloudflare as well (see scripts/deploy-hetzner.sh firewall) so direct-to-origin
# traffic never arrives at all.
#
# Refresh: https://www.cloudflare.com/ips/  — run scripts/refresh-cf-ips.sh
# BEGIN CLOUDFLARE IPS
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# END CLOUDFLARE IPS
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# -----------------------------------------------------------------------------
# Rate limiting (defence in depth — Cloudflare has its own rules in front)
# -----------------------------------------------------------------------------
# Keyed on $binary_remote_addr, which is the *visitor* address thanks to the
# real_ip block above. Without it every visitor would collapse into a handful
# of Cloudflare addresses and share one bucket.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# -----------------------------------------------------------------------------
# Access logging without query strings
# -----------------------------------------------------------------------------
# The default `combined` format logs $request — the full request line, query
# string included — so any endpoint taking an identifier as a query parameter
# writes it to disk in cleartext, outside the Fernet boundary and outside GDPR
# erasure. $uri is the path with no arguments, matching what the application
# logs (request.url.path, never request.url).
log_format api_no_query '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time '
                        'urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cloudflare connects to the origin over HTTPS under Full (strict), so
    # plain HTTP here is either a misconfiguration or a direct-to-origin probe.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name api.stratumai.app;

    # Cloudflare Origin Certificate (15-year validity, issued by Cloudflare and
    # trusted only by Cloudflare). Requires SSL mode "Full (strict)" in the
    # dashboard. Nothing to renew, and no ACME challenge path to keep open.
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Authenticated Origin Pulls: refuse any TLS client that is not Cloudflare.
    # Combined with the firewall this makes direct-to-origin requests fail at
    # the handshake rather than being merely rate-limited.
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/access.log api_no_query;

    client_max_body_size 50M;

    # Security headers. The API is JSON-only and never rendered as a document,
    # so the CSP is maximally restrictive rather than tuned for a page.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health check — unauthenticated by design, so keep it out of the access log.
    location /health {
        proxy_pass http://api_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Prometheus scrape. Not exposed through Cloudflare DNS; reachable only
    # from the private network. Denied here as a second line of defence in
    # case the record is ever proxied by mistake.
    location /metrics {
        deny all;
    }

    location /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        access_log /var/log/nginx/access.log api_no_query;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api_upstream;
    }

    location /api/v1/auth/signup {
        limit_req zone=login_limit burst=3 nodelay;
        access_log /var/log/nginx/access.log api_no_query;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api_upstream;
    }

    location /ws/ {
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://api_upstream;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
