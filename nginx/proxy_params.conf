# =============================================================================
# Shared proxy headers for the API upstream
# =============================================================================
# Included by every proxying location in stratumai.conf so the header set
# cannot drift between them — the reason the auth locations in beta.conf ended
# up with a different (and smaller) set than /api/.
#
# $remote_addr and $proxy_add_x_forwarded_for are the *visitor* address here,
# not Cloudflare's, because the real_ip block in stratumai.conf has already
# rewritten them from CF-Connecting-IP.
# =============================================================================

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";

# Pass Cloudflare's own metadata through for debugging and geo-aware logic.
proxy_set_header CF-Ray $http_cf_ray;
proxy_set_header CF-IPCountry $http_cf_ipcountry;

# Only connect timeout lives here. send/read timeouts legitimately differ per
# location — 300s for the API, 3600s for WebSockets — and an `include` places
# its directives in the *including* context, so a location that also sets one
# is a duplicate-directive error rather than an override. Anything that varies
# must stay at the call site.
proxy_connect_timeout 60s;
