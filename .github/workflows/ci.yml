# =============================================================================
# Stratum AI - Continuous Integration
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # MUST track frontend/Dockerfile's `FROM node:<v>-alpine`. This was "20"
  # while the Dockerfile built and shipped on 26 — six majors between what CI
  # validated and what production ran, with no .nvmrc or package.json engines
  # field to catch the drift. It surfaced when jsdom 30 (PR #686) raised its
  # floor to ^22.22.2 || ^24.15.0 || >=26.0.0: npm installed it anyway, because
  # engines are advisory without engine-strict, and every vitest worker then
  # died on `webidl.util.markAsUncloneable is not a function` from the undici 8
  # that jsdom 30 pulls in. The run reported 65 unhandled errors and
  # "Test Files: no tests" — a suite that executed nothing, not a suite that
  # passed.
  NODE_VERSION: "26"

jobs:
  # ===========================================================================
  # Backend Quality Gates (lint / format / imports / types)
  # ===========================================================================
  # Every gate in the backend jobs runs with continue-on-error and a final
  # aggregator step, so an early failure can't mask the later gates. This is
  # the #343 hardening: the old sequential job died at the first failing step
  # (Black), which hid never-running integration tests, a coverage gate that
  # had never passed, and Bandit findings for months.
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          # setuptools/wheel are upgraded alongside pip to match backend/Dockerfile:
          # the runner's bundled setuptools is old enough to carry fixable
          # advisories that pip-audit reports against the installed environment.
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Lint with Ruff
        id: ruff
        continue-on-error: true
        run: ruff check . --output-format=github

      - name: Check formatting with Black
        id: black
        continue-on-error: true
        run: black --check --diff .

      - name: Check import sorting with isort
        id: isort
        continue-on-error: true
        run: isort --check-only --diff .

      - name: Type check with mypy
        id: mypy
        continue-on-error: true
        run: mypy app --ignore-missing-imports --no-error-summary

      - name: Aggregate quality gates
        env:
          GATE_RUFF: ${{ steps.ruff.outcome }}
          GATE_BLACK: ${{ steps.black.outcome }}
          GATE_ISORT: ${{ steps.isort.outcome }}
          GATE_MYPY: ${{ steps.mypy.outcome }}
        run: |
          failed=0
          for gate in "Ruff:$GATE_RUFF" "Black:$GATE_BLACK" \
                      "isort:$GATE_ISORT" "mypy:$GATE_MYPY"; do
            name="${gate%%:*}"; outcome="${gate##*:}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error::Quality gate failed: $name"
              failed=1
            fi
          done
          exit $failed

  # ===========================================================================
  # Backend Tests & Coverage
  # ===========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/stratum_test
      DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/stratum_test
      # The integration conftest reads TEST_DATABASE_URL[_SYNC] (falling back
      # to a local "stratum" default) — point it at the CI Postgres service
      # so it doesn't try to auth as a non-existent "stratum" role.
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/stratum_test
      TEST_DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/stratum_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-that-is-at-least-32-chars-long
      JWT_SECRET_KEY: test-jwt-secret-that-is-at-least-32-chars
      PII_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVz
      APP_ENV: test
      PYTHONPATH: .

    services:
      postgres:
        # pgvector image: the integration harness runs the real Alembic
        # chain, which includes migration 049 (CREATE EXTENSION vector).
        # Plain postgres:16 lacks it. Same as the load-tests job.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          # setuptools/wheel are upgraded alongside pip to match backend/Dockerfile:
          # the runner's bundled setuptools is old enough to carry fixable
          # advisories that pip-audit reports against the installed environment.
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run unit tests
        id: unit
        continue-on-error: true
        run: |
          coverage erase
          pytest tests/unit -v --tb=short -m "unit or not integration" \
            --junitxml=unit-junit.xml \
            --cov=app --cov-config=.coveragerc --cov-append --cov-fail-under=0

      - name: Run integration tests
        id: integration
        continue-on-error: true
        run: |
          # Integration tests run on a single session-scoped event loop: the
          # FastAPI test app uses Starlette BaseHTTPMiddleware (TenantMiddleware),
          # which under pytest-asyncio's default per-test loop yields
          # "Future attached to a different loop" / "Event loop is closed".
          # Scoped here (not in pytest.ini) so the unit suite keeps its loops.
          pytest tests/integration -v --tb=short -m "integration" \
            -o asyncio_default_test_loop_scope=session \
            -o asyncio_default_fixture_loop_scope=session \
            --junitxml=integration-junit.xml \
            --cov=app --cov-config=.coveragerc --cov-append --cov-fail-under=0

      - name: Assert suites actually ran (vacuous-pass guard)
        id: rancount
        continue-on-error: true
        run: |
          # A suite that collects 0 tests or skips nearly everything (e.g. a
          # broken DB connection turning into skips) must fail loudly, not
          # pass vacuously. Floors sit well under the current counts
          # (3561 unit / 706 integration at time of writing) but far above
          # any plausible "the harness silently broke" number.
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          FLOORS = {"unit-junit.xml": 3000, "integration-junit.xml": 600}
          failed = False
          for path, floor in FLOORS.items():
              try:
                  root = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as exc:
                  print(f"::error::{path}: unreadable junit report ({exc})")
                  failed = True
                  continue
              suites = [root] if root.tag == "testsuite" else list(root)
              tests = sum(int(s.get("tests", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              ran = tests - skipped
              print(f"{path}: collected={tests} skipped={skipped} ran={ran} floor={floor}")
              if ran < floor:
                  print(f"::error::{path}: only {ran} tests ran, floor is {floor}")
                  failed = True

          # Every test file on disk must contribute at least one collected
          # test. A total-count floor cannot see one module going quiet: the
          # other 300 files keep the number well above it.
          #
          # This is not hypothetical. test_adapter_whatsapp_deep.py (1204
          # lines) and test_knowledge_graph.py (277) both lacked a pytestmark,
          # so `-m "integration"` deselected them entirely. They looked like
          # coverage for months and produced none — and by the time the first
          # was switched on, its mocks had rotted. Nothing reported it, because
          # a file that is collected and then filtered out is indistinguishable
          # from a file that was never there.
          import pathlib

          SUITES = {
              "unit-junit.xml": pathlib.Path("tests/unit"),
              "integration-junit.xml": pathlib.Path("tests/integration"),
          }
          for report, suite_dir in SUITES.items():
              try:
                  root = ET.parse(report).getroot()
              except (OSError, ET.ParseError):
                  continue  # already reported above

              seen = set()
              for case in root.iter("testcase"):
                  # pytest sets `file` on each testcase; fall back to the
                  # dotted classname when a plugin strips it.
                  f = case.get("file")
                  if not f:
                      cls = case.get("classname", "")
                      parts = [p for p in cls.split(".") if p]
                      while parts and not parts[-1].startswith("test_"):
                          parts.pop()
                      f = "/".join(parts) + ".py" if parts else ""
                  if f:
                      seen.add(pathlib.Path(f).name)

              on_disk = {p.name for p in suite_dir.glob("test_*.py")}
              missing = sorted(on_disk - seen)
              print(f"{suite_dir}: {len(on_disk)} files on disk, {len(seen)} collected")
              if missing:
                  for name in missing:
                      print(
                          f"::error::{suite_dir}/{name} contributed no tests — "
                          "missing pytestmark, or every test deselected"
                      )
                  failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Coverage report (ratchet gate)
        id: coverage
        continue-on-error: true
        run: |
          # Combined unit + integration coverage: both test steps above ran with
          # --cov-append into a single .coverage file (unit and integration each
          # exercise different layers — endpoints/services are driven by the
          # integration suite). Emit the combined report + xml and enforce the
          # .coveragerc fail_under (the #342 ratchet — only ever raise it) on
          # the COMBINED total.
          coverage xml
          coverage report --show-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov
          retention-days: 7

      - name: Aggregate test gates
        env:
          GATE_UNIT: ${{ steps.unit.outcome }}
          GATE_INTEGRATION: ${{ steps.integration.outcome }}
          GATE_RANCOUNT: ${{ steps.rancount.outcome }}
          GATE_COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          failed=0
          for gate in "Unit tests:$GATE_UNIT" \
                      "Integration tests:$GATE_INTEGRATION" \
                      "Ran-count guard:$GATE_RANCOUNT" \
                      "Coverage ratchet:$GATE_COVERAGE"; do
            name="${gate%%:*}"; outcome="${gate##*:}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error::Test gate failed: $name"
              failed=1
            fi
          done
          exit $failed

  # ===========================================================================
  # Backend Security Gates (Bandit / pip-audit)
  # ===========================================================================
  backend-security:
    name: Backend Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          # setuptools/wheel are upgraded alongside pip to match backend/Dockerfile:
          # the runner's bundled setuptools is old enough to carry fixable
          # advisories that pip-audit reports against the installed environment.
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Security scan with Bandit
        id: bandit
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r app/ -ll -ii

      - name: Dependency audit (pip-audit)
        id: pipaudit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --desc on

      - name: Aggregate security gates
        env:
          GATE_BANDIT: ${{ steps.bandit.outcome }}
          GATE_PIPAUDIT: ${{ steps.pipaudit.outcome }}
        run: |
          failed=0
          for gate in "Bandit:$GATE_BANDIT" "pip-audit:$GATE_PIPAUDIT"; do
            name="${gate%%:*}"; outcome="${gate##*:}"
            echo "$name: $outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error::Security gate failed: $name"
              failed=1
            fi
          done
          exit $failed

  # ===========================================================================
  # Frontend Tests & Build
  # ===========================================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Wrapper around `npm audit --json` that fails on unwaived findings only.
      # Plain `npm audit` is all-or-nothing, so a single advisory with no
      # published fix turned every PR red — including the dependency PRs that
      # existed to fix other advisories. Waivers live in
      # frontend/.audit-allowlist.json and expire.
      - name: Dependency audit (npm)
        run: node scripts/audit-gate.mjs --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --reporter=verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # VITE_API_URL, not VITE_API_BASE_URL — the frontend reads the former
          # and never the latter, so this job was building with no API URL at
          # all and validating a bundle that pointed at a relative /api/v1.
          # vite.config.ts now fails a production build without it, which also
          # keeps this job honest.
          VITE_API_URL: http://localhost:8000/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ===========================================================================
  # E2E Tests (runs after frontend build)
  # ===========================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    # Also runs on push. A PR being green does not prove the merged result is,
    # and this previously ran on pull_request only — so the artifact actually
    # deployed from main was never end-to-end tested.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Print findings before the gating scan. The gate below writes SARIF to a
      # file, so when it failed the log showed only "exit code 1" with no
      # indication of which package or advisory tripped it. This step never
      # fails; it exists purely so the log names the finding.
      - name: Trivy filesystem scan (report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      # limit-severities-for-sarif is required for `severity` to apply at all.
      # Without it the action logs "Building SARIF report with all severities"
      # and scans every severity, so exit-code 1 fired on LOW and MEDIUM
      # findings too — the CRITICAL,HIGH filter below was silently ignored.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      # Tagged with the commit SHA, not a fixed `:scan`. A locally built image
      # has no registry digest, so Trivy's per-artifact cache key falls back to
      # the tag — a constant tag made every run collide with the previous one's
      # cached analysis. That cache went stale long ago and kept reporting
      # package versions the image had not contained for months (msgpack 1.1.2
      # against an image holding 1.2.1, setuptools 70.3.0 against 84.0.0),
      # which is why the scan could not be fixed by changing dependencies.
      - name: Build Docker image for scanning
        run: docker build -t stratum-api:${{ github.sha }} ./backend

      # skip-files below excludes pip/_vendor/bom.cdx.json — a CycloneDX SBOM
      # pip ships describing its own vendored libraries. Trivy trusts an
      # embedded SBOM over the real site-packages contents, so it reported
      # pip's internal msgpack 1.1.2 and setuptools 70.3.0 as application
      # dependencies. Those versions were never in the image (it carries 1.2.1
      # and 84.0.0), which is why no requirements change could clear them.
      # pip's vendored code is not part of the app's dependency surface; the
      # packages that are get scanned from their own dist-info metadata.
      - name: Trivy container image scan (report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "stratum-api:${{ github.sha }}"
          skip-files: "**/pip/_vendor/bom.cdx.json"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "stratum-api:${{ github.sha }}"
          skip-files: "**/pip/_vendor/bom.cdx.json"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
        continue-on-error: true  # Requires GitHub Advanced Security; not all repos have code scanning

  # ===========================================================================
  # Secret Scanning
  # ===========================================================================
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # gitleaks-action's pull_request path reads the PR's commits and writes a
    # summary comment, so it needs more than the repository's default
    # read-only GITHUB_TOKEN — without this it fails with HTTP 403 "Resource
    # not accessible by integration" before scanning anything. Push runs took a
    # different code path and so kept passing, which is why this only ever
    # showed up on PRs.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dependabot PRs are the one case the `permissions:` block above cannot
      # rescue: those runs get a read-only token that job-level permissions are
      # not allowed to elevate, so gitleaks would still 403. They only ever
      # touch dependency manifests and lockfiles, and the push-to-main run
      # re-scans the merged result with a full-permission token.
      - name: Run gitleaks
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Deployment Config (nginx syntax, compose resolution)
  # ===========================================================================
  # These files are only exercised on a production host, so a typo in them is
  # discovered during a deploy — the worst time. nginx -t and compose config
  # are both cheap and catch the whole class.
  deploy-config:
    name: Deploy Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # stratumai.conf is included inside the stock nginx.conf's http{} block,
      # so it cannot be validated standalone — nginx -t on it alone fails with
      # "directive is not allowed here". Mount it where it actually lives.
      - name: Validate nginx configs
        run: |
          set -euo pipefail
          # The configs expect TLS material provisioned on the host and never
          # committed. Generate a throwaway pair so nginx can parse the ssl_*
          # directives; nothing here is used outside this job.
          mkdir -p ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ci-certs/origin.key -out ci-certs/origin.pem \
            -subj "/CN=api.stratumai.app" 2>/dev/null
          cp ci-certs/origin.pem ci-certs/cloudflare-origin-pull-ca.pem
          # beta.conf reads certbot paths rather than /etc/nginx/certs.
          mkdir -p ci-letsencrypt/live/beta.stratum-ai.com
          cp ci-certs/origin.pem ci-letsencrypt/live/beta.stratum-ai.com/fullchain.pem
          cp ci-certs/origin.key ci-letsencrypt/live/beta.stratum-ai.com/privkey.pem

          # nginx resolves `server <host>:<port>` in an upstream block at
          # PARSE time, so `server api:8000` aborts with "host not found in
          # upstream" wherever the compose network does not exist — including
          # here. Mapping the service names to loopback lets the parser finish;
          # nothing is connected to, so the target is irrelevant.
          for conf in nginx/stratumai.conf nginx/beta.conf; do
            echo "::group::nginx -t $conf"
            docker run --rm \
              --add-host api:127.0.0.1 \
              --add-host frontend:127.0.0.1 \
              -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/nginx/proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro" \
              -v "$PWD/ci-certs:/etc/nginx/certs:ro" \
              -v "$PWD/ci-letsencrypt:/etc/letsencrypt:ro" \
              nginx:1.27-alpine nginx -t
            echo "::endgroup::"
          done

      # A stale Cloudflare range list silently stops the origin trusting
      # CF-Connecting-IP from the new ranges, which reverts the audit trail and
      # rate limiting to recording edge addresses (issue #652). --check makes
      # that visible here instead of in production.
      - name: Check Cloudflare IP ranges are current
        continue-on-error: true
        run: ./scripts/refresh-cf-ips.sh --check

      - name: Validate compose files resolve
        run: |
          set -euo pipefail
          # Every ${VAR:?} in the compose files must be satisfied for `config`
          # to resolve, so feed it the template's variable names with dummy
          # values. This checks structure and interpolation, not the values.
          sed -E 's/^([A-Z0-9_]+)=.*$/\1=ci-placeholder/' .env.hetzner.template \
            | grep -E '^[A-Z0-9_]+=' > .env
          for stack in \
            "-f docker-compose.yml -f docker-compose.prod.yml" \
            "-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hetzner.yml"; do
            echo "::group::docker compose $stack config"
            docker compose $stack config >/dev/null
            echo "::endgroup::"
          done
          rm -f .env

      - name: Shell syntax
        run: |
          set -euo pipefail
          for s in scripts/*.sh scripts/backup/*.sh; do
            bash -n "$s" && echo "ok: $s"
          done

  # ===========================================================================
  # Release Gate (all required checks must pass)
  # ===========================================================================
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-tests, backend-security, frontend, security, secrets, deploy-config]
    if: always()

    steps:
      - name: Check all required jobs passed
        run: |
          echo "Backend Quality: ${{ needs.backend-quality.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Backend Security: ${{ needs.backend-security.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Secrets: ${{ needs.secrets.result }}"
          echo "Deploy Config: ${{ needs.deploy-config.result }}"
          if [[ "${{ needs.backend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.backend-tests.result }}" != "success" ]] || \
             [[ "${{ needs.backend-security.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.secrets.result }}" != "success" ]] || \
             [[ "${{ needs.deploy-config.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed — merge blocked"
            exit 1
          fi
          echo "All release gate checks passed"

  # ===========================================================================
  # Load Tests (on main branch merges only)
  # ===========================================================================
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    services:
      postgres:
        # pgvector image: load-tests runs `alembic upgrade head`, which includes
        # migration 049 (CREATE EXTENSION vector). Plain postgres:16 lacks it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          # setuptools/wheel are upgraded alongside pip to match backend/Dockerfile:
          # the runner's bundled setuptools is old enough to carry fixable
          # advisories that pip-audit reports against the installed environment.
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Start API server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/stratum_test
          DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/stratum_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-load-tests
          JWT_SECRET_KEY: test-jwt-secret-for-load-tests
          PII_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVz
          APP_ENV: test
          # Skip startup ML auto-training so uvicorn starts accepting
          # connections immediately; otherwise it trains from sample data during
          # lifespan startup and /health is refused while the k6 smoke check
          # runs (the autopilot endpoints under test don't need ML models).
          ML_AUTO_TRAIN: "false"
          # The lifespan superadmin seeder imports scripts/seed_superadmin, which
          # sys.exit(1)s at import when these are unset (SystemExit isn't caught
          # by the lifespan's except Exception) — that aborts startup once ML
          # training no longer blocks it first. Provide test values.
          SUPERADMIN_EMAIL: admin@stratum.test
          SUPERADMIN_PASSWORD: test_superadmin_password_change_me
        run: |
          # Widen alembic_version.version_num to VARCHAR(128) first: some
          # revision ids (e.g. 041_add_superadmin_to_userrole_enum, 35 chars)
          # exceed Alembic's default VARCHAR(32), which otherwise fails
          # `alembic upgrade head`. start.sh does this in the app image; the
          # load-test job runs alembic directly, so do it here too.
          python fix_alembic_version.py
          # Run migrations
          alembic upgrade head
          # Seed load test user
          python scripts/seed_load_test_user.py
          # Start server in background
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10  # Wait for server to start

      - name: Run load test smoke tests
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8000 \
            -e SCENARIO=smoke \
            -i grafana/k6 run - < tests/load/autopilot-enforcement-load-test.js

      - name: Upload load test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-test-results
          path: tests/load/*.json
          retention-days: 7
