# =============================================================================
# Stratum AI - Production Docker Compose Override
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL - Production settings (tuned per memory audit Feb 2026)
  # ===========================================================================
  db:
    restart: always
    # SECURITY: Do not expose DB port to host in production
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-stratum_ai}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G

  # ===========================================================================
  # Redis - Production settings (memory audit Feb 2026)
  # ===========================================================================
  redis:
    restart: always
    # SECURITY: Do not expose Redis port to host in production
    ports: !reset []
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # FastAPI Backend - Production
  # ===========================================================================
  api:
    restart: always
    environment:
      - APP_ENV=production
      - DEBUG=false
      # docker-compose.yml defaults this to true for local work, and Settings
      # rejects app_env=production with it on — so without this override the
      # production stack cannot start at all. Found on the first real deploy.
      - USE_MOCK_AD_DATA=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-stratum_ai}?prepared_statement_cache_size=0
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-stratum_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.yourdomain.com}
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./ml_service/models:/app/ml_service/models:ro
    depends_on:
      - pgbouncer
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Celery Worker - Production
  # ===========================================================================
  worker:
    restart: always
    environment:
      - APP_ENV=production
      - USE_MOCK_AD_DATA=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-stratum_ai}?prepared_statement_cache_size=0
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-stratum_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
      - LOG_LEVEL=WARNING
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - ./ml_service/models:/app/ml_service/models:ro
    depends_on:
      - pgbouncer
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=2
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Celery Beat - Production (memory audit Feb 2026)
  # ===========================================================================
  scheduler:
    restart: always
    environment:
      - APP_ENV=production
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-stratum_ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-}@redis:6379/2
    volumes: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('celerybeat-schedule') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # React Frontend - Production (Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      - NODE_ENV=production
    volumes: []
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M

  # ===========================================================================
  # PgBouncer - Connection Pooling (memory audit Feb 2026)
  # ===========================================================================
  pgbouncer:
    # edoburu/pgbouncer publishes patch-suffixed tags (1.22.1-p0), never a
    # bare minor. `1.22` has never existed, so this file could not start as
    # written — caught bringing the Hetzner host up for the first time.
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: stratum_pgbouncer
    restart: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stratum_ai}
      # edoburu/pgbouncer listens on 5432 unless told otherwise, but every
      # DATABASE_URL in this file points at pgbouncer:6432 and the healthcheck
      # probes 6432 — so it came up "unhealthy" and the API could not connect.
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
    # NOTE: No host port exposure — PgBouncer is internal to the Docker network only
    expose:
      - "6432"
    # Every service in docker-compose.yml joins stratum_network explicitly.
    # pgbouncer is introduced here, and a service that declares no network gets
    # the project default instead — so it sat on stratum_default while the API
    # looked for it on stratum_stratum_network and failed DNS resolution.
    networks:
      - stratum_network
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Flower - Disabled in production by default
  # ===========================================================================
  flower:
    profiles:
      - monitoring
