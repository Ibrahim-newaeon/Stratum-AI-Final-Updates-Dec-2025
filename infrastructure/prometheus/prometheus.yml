# =============================================================================
# Stratum AI - Prometheus Configuration
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

# Rules evaluated into a live Alertmanager. This list was empty, so every
# rule in alerts.yml computed a result and then discarded it.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Stratum API
  - job_name: 'stratum-api'
    metrics_path: '/metrics'
    # /metrics carries tenant_id-labeled series and is tenant-exempt, so the
    # scrape authenticates. The key file is written at deploy time from
    # METRICS_API_KEY; the API rejects unauthenticated scrapes whenever that
    # variable is set. Scraping goes direct to api:8000 over the compose
    # network, so it never passes the edge — which denies /metrics outright.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_api_key
    static_configs:
      - targets: ['api:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'stratum-api'

  # The celery worker used to be scraped at worker:8000. It runs
  # `celery ... worker` and serves no HTTP at all, so that target could never
  # come up: `up{job="stratum-worker"}` sat at 0 permanently and the WorkerDown
  # rule fired forever. An alert that is always firing is worse than no alert —
  # it is the one that teaches you to ignore the others.
  #
  # Worker liveness is tracked instead through the heartbeat the worker writes
  # to Redis, which the API reads (app/workers/tasks/monitoring.py:
  # worker_is_alive) and reports on /health. Exposing that as a gauge so it can
  # carry an alert is a follow-up; until then /health is the source of truth.

  # Redis Exporter (optional - requires redis_exporter container)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL Exporter (optional - requires postgres_exporter container)
  # - job_name: 'postgresql'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
