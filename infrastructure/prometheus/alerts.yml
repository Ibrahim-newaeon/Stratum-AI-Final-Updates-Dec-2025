# =============================================================================
# Stratum AI - Prometheus Alert Rules
# =============================================================================
# Every expression below is checked against the metric names the API actually
# exposes. Verified by reading /metrics off the running production container
# rather than by grepping for Gauge/Counter definitions — a metric can be
# declared in app/core/metrics.py and still never be registered.
#
# Four rules were removed because the series they queried do not exist:
#
#   DatabaseConnectionPoolExhausted   db_pool_size, db_pool_available
#   SlowDatabaseQueries               db_query_duration_seconds
#   HighRateLimiting                  rate_limit_exceeded_total
#   WorkerDown                        up{job="stratum-worker"}
#
# The first three never matched a series, so PromQL returned an empty vector
# and the alert sat inactive forever — indistinguishable, on a dashboard, from
# a system that is fine. (`db_pool_size` does exist in the codebase, but as a
# pydantic config field, not a metric.) The fourth had the opposite failure:
# it scraped an HTTP endpoint the celery worker never served, so it fired
# permanently. Both shapes are worse than no rule at all.
#
# Restoring them means instrumenting the API first. Tracked as a follow-up;
# do not re-add a rule here before confirming its series appears in /metrics.
groups:
  - name: stratum-api
    interval: 30s
    rules:
      # High Error Rate
      # stratum_http_request_duration_seconds is emitted by the
      # prometheus-fastapi-instrumentator (app/core/metrics.py); status is
      # grouped ("2xx", "5xx", ...) and handler is the templated route path.
      - alert: HighErrorRate
        expr: |
          sum(rate(stratum_http_request_duration_seconds_count{status="5xx"}[5m]))
          / sum(rate(stratum_http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      # High Latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(stratum_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value | humanizeDuration }}"

      # API Down
      - alert: APIDown
        expr: up{job="stratum-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Stratum API is down"
          description: "The Stratum API has been unreachable for more than 1 minute"

      # Worker Down
      #
      # Restored from #661, which deleted it because the old expression
      # `up{job="stratum-worker"} == 0` could never fire: the worker serves no
      # HTTP and nothing scrapes it, so that series never existed. Prometheus
      # evaluates a rule over a missing series as "no data", not as a failure,
      # which is why it looked healthy for as long as it was deployed.
      #
      # This reads the gauge the API exports instead. The worker writes an epoch
      # to `stratum:worker:heartbeat` (TTL 300) once a minute and the API
      # publishes that reading on every scrape. `absent()` covers the other
      # half: if the API stops exporting the series at all, the alert fires
      # rather than going quiet — the exact way the previous rule failed.
      - alert: WorkerDown
        expr: |
          stratum_celery_worker_up == 0
          or absent(stratum_celery_worker_up)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery worker is down"
          description: >-
            No fresh Celery worker heartbeat for more than 5 minutes.
            Periodic tasks, including the audit-log drain, are not running.

  - name: stratum-resources
    interval: 30s
    rules:
      # High Memory Usage
      # The api container is capped at 3G in docker-compose.prod.yml; alert
      # with headroom to act rather than at the point the OOM killer does.
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes{job="stratum-api"}
          / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "API memory usage is {{ $value | humanize }}GB"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total{job="stratum-api"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "API CPU usage is {{ $value | humanizePercentage }}"

  - name: stratum-trust-layer
    interval: 30s
    rules:
      # Signal Health Degraded
      - alert: SignalHealthDegraded
        expr: |
          avg(stratum_signal_health_score{job="stratum-api"}) < 70
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Signal health degraded"
          description: "Average signal health score is {{ $value }}"

      # Autopilot Frozen
      - alert: AutopilotFrozen
        expr: |
          stratum_autopilot_mode{job="stratum-api"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Autopilot has been frozen"
          description: "Autopilot mode has been frozen for more than 30 minutes"
